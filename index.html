<!doctype html>
<html lang="en">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="data:," />
  <title>Tara Glen</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: none;
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #game { position: fixed; inset: 0; }
    canvas { image-rendering: pixelated; }
    #credit { position: fixed; right: 4px; bottom: 2px; font: 10px sans-serif; color: rgba(255,255,255,.7); pointer-events: none; text-shadow: 0 0 2px #000; z-index: 2; }
    #bike { position: fixed; right: 22px; bottom: 150px; width: 44px; height: 44px; border-radius: 50%; border: 3px solid rgba(255,255,255,.75);
      background: rgba(30,30,40,.45); font-size: 22px; display: none; align-items: center; justify-content: center; z-index: 3; padding: 0; touch-action: none; }
    #bike.on { background: rgba(220,60,60,.75); }
    #fire { position: fixed; right: 116px; bottom: 122px; width: 48px; height: 48px; border-radius: 50%; border: 3px solid rgba(255,255,255,.75);
      background: rgba(40,110,200,.55); font-size: 22px; display: none; align-items: center; justify-content: center; z-index: 3; padding: 0; touch-action: none; position: fixed; }
    #fire small { position: absolute; right: -4px; bottom: -4px; background: #fff; color: #135; font: 800 13px sans-serif; border-radius: 9px; padding: 1px 6px; }
    #fire.empty { filter: grayscale(1); opacity: .6; }
    #hearts { letter-spacing: 1px; } #abilities, #coins, #shells, #kids { font-size: 14px; } #hud-row { flex-wrap: wrap; max-width: 70vw; }
    #toast { position: fixed; left: 50%; top: 96px; transform: translateX(-50%); padding: 6px 12px; border-radius: 8px; background: rgba(0,0,0,.65);
      color: #fff; font: 14px sans-serif; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 3; }
    #hud { position: fixed; left: 8px; top: 8px; z-index: 3; color: #fff; font: 600 14px sans-serif; text-shadow: 0 1px 2px #000; pointer-events: none; }
    #objective { background: rgba(0,0,0,.45); padding: 5px 10px; border-radius: 8px; display: inline-block; max-width: calc(100vw - 90px); font-size: 13px; margin-bottom: 4px; }
    #hud-row { margin-top: 5px; display: flex; gap: 10px; align-items: center; }
    #badges span { opacity: .3; filter: grayscale(1); margin-right: 2px; font-size: 16px; } #badges span.got { opacity: 1; filter: none; }
    #menu-btn { position: fixed; right: 8px; top: 8px; z-index: 3; width: 38px; height: 38px; border-radius: 10px; border: 2px solid rgba(255,255,255,.7); background: rgba(0,0,0,.4); color: #fff; font-size: 18px; }
    #menu { position: fixed; right: 8px; top: 52px; z-index: 4; display: none; flex-direction: column; gap: 6px; background: rgba(20,24,32,.92); padding: 10px; border-radius: 10px; }
    #menu.show { display: flex; } #menu button, #end button { font: 600 14px sans-serif; padding: 8px 14px; border-radius: 8px; border: 0; }
    #prompt { display: none !important; position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 3; width: 64px; height: 64px; border-radius: 50%;
      border: 3px solid #fff; background: rgba(230,60,60,.85); color: #fff; font: 800 28px sans-serif; display: none; align-items: center; justify-content: center; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { transform: translateX(-50%) scale(1.08); } }
    #arrow { position: fixed; left: 0; top: 0; z-index: 2; width: 32px; height: 32px; line-height: 32px; text-align: center; color: #ffe066; font-size: 26px;
      text-shadow: 0 0 3px #000, 0 0 6px #000; display: none; pointer-events: none; }
    #timer { position: fixed; left: 50%; top: 52px; transform: translateX(-50%); z-index: 3; background: rgba(0,0,0,.6); color: #fff; font: 700 18px sans-serif; padding: 6px 14px; border-radius: 10px; display: none; }
    #end { position: fixed; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.5); }
    #end.show { display: flex; }
    #end .card { width: min(86vw, 360px); padding: 26px 22px; border-radius: 22px; text-align: center; color: #fff; font-family: sans-serif;
      background: linear-gradient(160deg, #2b6cb0 0%, #38a169 55%, #ecc94b 100%); box-shadow: 0 10px 40px rgba(0,0,0,.5); border: 4px solid #fff; }
    #end-title { font: 900 34px sans-serif; letter-spacing: 1px; text-shadow: 0 3px 0 rgba(0,0,0,.3); }
    #end-sub { font: 600 16px sans-serif; opacity: .95; margin: 4px 0 12px; }
    #end-badges { font-size: 30px; margin-bottom: 12px; } #end-badges span { margin: 0 4px; opacity: .3; } #end-badges span.got { opacity: 1; }
    #end-stats div { display: flex; justify-content: space-between; background: rgba(0,0,0,.22); margin: 6px 0; padding: 9px 14px; border-radius: 10px; font-size: 16px; }
    #end-stats span { font-weight: 800; } #end button { margin: 14px 4px 0; } #end-again { background: #fff; color: #2b6cb0; } #end-more { background: rgba(255,255,255,.25); color: #fff; }
    body.overview #hud, body.overview .rbtn, body.overview #menu-btn { display: none !important; }
    body:not(.hints) #arrow { display: none !important; } /* edge arrow only with ?hints */
    #objective { pointer-events: auto; cursor: pointer; } #objective.min { max-width: 22px; overflow: hidden; white-space: nowrap; } #objective:empty { display: none; }
    /* v9 action controls: big Attack (tap = combo, hold = charge; becomes Interact near something) + big Dodge in an arc, thumb-sized */
    #atk { position: fixed; right: 20px; bottom: 30px; width: 92px; height: 92px; border-radius: 50%; border: 4px solid rgba(255,255,255,.85); z-index: 3; padding: 0;
      background: radial-gradient(circle at 40% 35%, rgba(240,90,70,.85), rgba(170,40,40,.8)); color: #fff; font: 800 36px sans-serif; display: flex; align-items: center; justify-content: center; touch-action: none; }
    #atk.talk { background: radial-gradient(circle at 40% 35%, rgba(90,190,120,.9), rgba(30,120,70,.85)); }
    #atk.held { transform: scale(.93); } #atk.charged { box-shadow: 0 0 0 5px #ffe066, 0 0 18px #ffe066; }
    #dash { position: fixed; right: 124px; bottom: 26px; width: 70px; height: 70px; border-radius: 50%; border: 4px solid rgba(255,255,255,.8);
      background: radial-gradient(circle at 40% 35%, rgba(90,160,240,.8), rgba(40,80,170,.8)); font-size: 30px; display: flex; align-items: center; justify-content: center; z-index: 3; padding: 0; touch-action: none; color: #fff; }
    #dash.cool { opacity: .45; }

    .rbtn { position: fixed; z-index: 3; width: 42px; height: 42px; border-radius: 12px; border: 2px solid rgba(255,255,255,.7); background: rgba(0,0,0,.45);
      color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; padding: 0; touch-action: none; }
    #bag-btn { right: 8px; top: 54px; } #hint-btn { right: 8px; top: 100px; display: none; } #debug-btn { right: 8px; top: 146px; display: none; }
    #menu-btn { width: 42px; height: 42px; }
    #choices { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); z-index: 6; display: none; flex-direction: column; gap: 8px; width: min(90vw, 420px); }
    #choices button { font: 700 16px sans-serif; padding: 12px; border-radius: 12px; border: 3px solid #f4e7c5; background: #2c3a55; color: #fff; text-align: left; }
    #bag { position: fixed; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.55); }
    #bag.show { display: flex; }
    #bag .card { width: min(92vw, 420px); background: #1b2230; border: 3px solid #f4e7c5; border-radius: 16px; padding: 14px; color: #fff; font: 14px sans-serif; }
    #bag h4 { margin: 4px 0 8px; font-size: 15px; color: #f4e7c5; display: flex; justify-content: space-between; }
    #bag-items, #bag-abil { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; margin-bottom: 10px; }
    #bag button[data-k] { position: relative; height: 52px; border-radius: 10px; border: 2px solid #49556e; background: #2a3448; font-size: 26px; padding: 0; }
    #bag button.sel { border-color: #ffd34d; background: #4a4a2a; }
    #bag button small { position: absolute; right: 3px; bottom: 1px; font: 800 11px sans-serif; color: #fff; }
    #bag-desc { min-height: 40px; background: rgba(255,255,255,.07); border-radius: 8px; padding: 8px; }
    #bag-close { background: none; border: 0; color: #fff; font-size: 18px; }
    #banner { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 3; color: #fff; text-align: center; pointer-events: none; opacity: 0;
      text-shadow: 0 2px 0 #000, 0 0 8px #000; font: 900 26px sans-serif; white-space: nowrap; }
    #banner small { display: block; font: 700 14px sans-serif; color: #ffe680; }
    #banner.show { animation: banner 2.6s ease forwards; }
    @keyframes banner { 0% { opacity: 0; transform: translate(-50%, 10px); } 15%, 75% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
    #bossbar { position: fixed; left: 50%; top: 58px; transform: translateX(-50%); z-index: 3; width: min(70vw, 300px); height: 14px; background: rgba(0,0,0,.6);
      border: 2px solid #fff; border-radius: 8px; display: none; overflow: hidden; }
    #bossbar i { display: block; height: 100%; background: linear-gradient(#ff6b6b, #c0392b); }
    #bossbar span { position: absolute; left: 0; right: 0; top: -20px; text-align: center; color: #fff; font: 800 13px sans-serif; text-shadow: 0 1px 2px #000; }
    :root { --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --bar: min(6vh, 40px); }
    /* cinematic bars sit *behind* the HUD/dialogue (canvas text is placed above them by ui.ts); they grow into the notch/home-bar areas */
    body.moment::before, body.moment::after { content: ''; position: fixed; left: 0; right: 0; background: #000; z-index: 1; animation: bars .8s ease; pointer-events: none; }
    body.moment::before { top: 0; height: calc(var(--bar) + var(--sat)); } body.moment::after { bottom: 0; height: calc(var(--bar) + var(--sab)); }
    body.talking #atk, body.talking #fire, body.talking #dash, body.talking #bike, body.talking #prompt, body.talking #credit { visibility: hidden; }
    #hud { margin-top: var(--sat); margin-left: var(--sal); } .rbtn, #menu-btn { margin-top: var(--sat); margin-right: var(--sar); }
    #atk, #fire, #bike, #dash, #prompt { margin-bottom: var(--sab); } #atk, #fire, #bike, #dash { margin-right: var(--sar); }
    #choices { bottom: calc(var(--dlg, 150px) + 10px) !important; max-height: calc(100dvh - var(--dlg, 150px) - var(--sat) - 70px); overflow-y: auto;
      width: min(calc(100vw - var(--sal) - var(--sar) - 24px), 420px) !important; }
    #end { padding: calc(var(--sat) + 10px) calc(var(--sar) + 10px) calc(var(--sab) + 10px) calc(var(--sal) + 10px); box-sizing: border-box; }
    #end .card { max-height: 100%; overflow-y: auto; box-sizing: border-box; max-width: 100%; }
    #end-title { font-size: clamp(24px, 9vw, 34px) !important; overflow-wrap: anywhere; } #end-sub { overflow-wrap: anywhere; }
    @media (max-height: 520px) { #end .card { padding: 12px 18px; width: min(92vw, 560px); } #end-title { font-size: 26px !important; } #end-sub { margin: 0 0 6px; }
      #end-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0 8px; } #end-stats div { padding: 6px 10px; margin: 4px 0; font-size: 14px; } #end button { margin-top: 8px; } }
    #banner { max-width: calc(100vw - var(--sal) - var(--sar) - 24px); top: calc(22% + var(--sat)); }
    #toast { max-width: calc(100vw - 32px); top: calc(96px + var(--sat)); }
    body.moment #game { filter: sepia(.35) saturate(1.2) brightness(1.05); transition: filter .8s; }
    @keyframes bars { from { height: 0; } }
    #debug { position: fixed; left: 8px; right: 8px; top: 60px; max-height: 75vh; overflow: auto; z-index: 7; display: none; background: rgba(15,18,26,.96); color: #dfe6f3;
      border: 2px solid #6b7da0; border-radius: 12px; padding: 10px; font: 13px sans-serif; }
    #debug.show { display: block; } #debug h3 { margin: 0 0 8px; display: flex; justify-content: space-between; }
    #debug label { display: flex; gap: 6px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
    #debug select, #debug input, #debug button { font: 13px sans-serif; padding: 6px 8px; border-radius: 6px; border: 1px solid #6b7da0; background: #222b3c; color: #fff; }
    #debug input#dbg-link { width: 100%; box-sizing: border-box; } #debug ol { padding-left: 20px; } #debug li { margin: 3px 0; font-size: 12px; }
    #debug pre { font-size: 10px; white-space: pre-wrap; }
    #stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
      background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.4); display: none; pointer-events: none; }
    #knob { position: absolute; left: 30px; top: 30px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.55); }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="credit">Layout traced from aerial imagery · private joke game</div>
  <button id="bike" aria-label="Bike">🚲</button>
  <button id="fire" aria-label="Throw"></button>
  <button id="dash" aria-label="Dodge">💨</button>
  <button id="atk" aria-label="Attack">⚔️</button>
  <div id="hud"><div id="objective"></div><div id="hud-row"><span id="hearts"></span><span id="coins"></span><span id="shells"></span><span id="kids"></span><span id="abilities"></span></div></div>
  <button id="bag-btn" class="rbtn" aria-label="Bag">🎒</button><button id="hint-btn" class="rbtn" aria-label="Hint">📻</button><button id="debug-btn" class="rbtn" aria-label="Debug">🛠</button>
  <div id="choices"></div><div id="banner"></div><div id="bossbar"></div><div id="debug"></div>
  <div id="bag"><div class="card"><h4>🎒 Your bag <button id="bag-close">✕</button></h4><div id="bag-items"></div><h4>Abilities</h4><div id="bag-abil"></div><div id="bag-desc"></div></div></div>
  <button id="menu-btn" aria-label="Menu">☰</button>
  <div id="menu"><button id="menu-reset">Reset progress</button><button id="menu-close">Close</button></div>
  <button id="prompt" aria-label="Play">A</button>
  <div id="arrow">➤</div>
  <div id="timer"></div>
  <div id="end"><div class="card"><div id="end-title"></div><div id="end-sub"></div><div id="end-stats"></div>
    <button id="end-again"></button><button id="end-more"></button></div></div>
  <div id="toast"></div>
  <div id="stick"><div id="knob"></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
