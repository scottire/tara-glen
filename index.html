<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="data:," />
  <title>Tara Glen</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: none;
      overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #game { position: fixed; inset: 0; }
    canvas { image-rendering: pixelated; }
    #osm { position: fixed; right: 4px; bottom: 2px; font: 10px sans-serif; color: rgba(255,255,255,.7); text-decoration: none; text-shadow: 0 0 2px #000; z-index: 2; }
    #stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
      background: rgba(255,255,255,.15); border: 2px solid rgba(255,255,255,.4); display: none; pointer-events: none; }
    #knob { position: absolute; left: 30px; top: 30px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.55); }
  </style>
</head>
<body>
  <div id="game"></div>
  <a id="osm" href="https://www.openstreetmap.org/copyright" target="_blank">© OpenStreetMap contributors</a>
  <div id="stick"><div id="knob"></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
